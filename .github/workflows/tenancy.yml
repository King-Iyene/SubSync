# Full tenant-isolation check (scripts/check-tenancy.ts) on every pull request to main, on a throwaway Postgres.
# It never touches the production database and uses made-up secrets. See docs/TENANCY_CI.md.
name: tenancy

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tenancy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tenancy:
    name: Tenant isolation (full check)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: ci
      MIGRATE_DATABASE_URL: postgresql://postgres:ci@localhost:5432/postgres
      MIGRATE_SSL: "off"
      PGOPTIONS: "-c search_path=public,extensions"
      DATABASE_URL: postgresql://postgres:ci@localhost:5432/postgres
      DATABASE_SSL: "off"
      DB_POOL_MAX: "10"
      FLAGS_ALL_ON: "true"
      ENTITLEMENTS_MODE: open
      TEST_PORT: "3102"
      TEST_DIST_DIR: .next-int2
      CHECKS: check-tenancy
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/cache@v4
        with:
          path: .next-int2/cache
          key: next-cache-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            next-cache-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - run: npm ci
      - name: Make the database look like Supabase
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c "create schema if not exists extensions; create extension if not exists pgcrypto schema extensions; create extension if not exists pg_trgm schema extensions; create role anon nologin; create role authenticated nologin; create role service_role nologin bypassrls;"
      - name: Apply every migration
        run: node --import tsx scripts/migrate.ts
      - name: Write a test-only .env.local (made-up values, no real secrets)
        run: |
          {
            echo "TOKEN_ENCRYPTION_KEY=$(head -c 32 /dev/urandom | base64)"
            echo "NEXT_PUBLIC_APP_URL=http://localhost:3102"
            echo "NEXT_PUBLIC_SUPABASE_URL=http://localhost:54321"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=ci-anon"
            echo "SUPABASE_SERVICE_ROLE_KEY=ci-service"
            echo "GHL_APP_ID=ci-app"
            echo "GHL_CLIENT_ID=ci-client"
            echo "GHL_CLIENT_SECRET=ci-secret"
            echo "GHL_APP_SHARED_SECRET=ci-shared"
            echo "GHL_REDIRECT_URI=http://localhost:3102/api/oauth/callback"
            echo "DEMO_MODE=true"
          } > .env.local
      - name: Run the full tenancy check
        run: |
          set -o pipefail
          node scripts/with-dev-server.mjs 2>&1 | tee tenancy.log
          grep -q "nothing changed: ok" tenancy.log
      - name: Upload the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tenancy-log
          path: tenancy.log
          if-no-files-found: ignore

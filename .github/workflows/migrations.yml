# Database migrations.
#
# 1. "Check" runs on every push and pull request: it applies ALL migrations to a brand-new throwaway Postgres, then typechecks and runs the unit tests.
#    A migration that does not apply cleanly from scratch, or that drops/truncates/deletes, fails here before it can reach production.
# 2. "Apply to Supabase" runs only on a push to main that changes supabase/migrations (or by hand), after "Check" passes (no approval wait)
#    (GitHub Environment "production", no required reviewers). It applies only the migrations not yet recorded, once each, in order.
#
# One-time setup (King): see docs/MERGE_AND_MIGRATE.md, section "Automatic migrations".
name: migrations

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only list what would be applied (nothing changes)"
        type: boolean
        default: true
      baseline_through:
        description: "ONE TIME ONLY: mark every migration up to this file name as already applied, without running it (for a database that already has them)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: migrations-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Check (fresh database)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: ci
      MIGRATE_DATABASE_URL: postgresql://postgres:ci@localhost:5432/postgres
      MIGRATE_SSL: "off"
      PGOPTIONS: "-c search_path=public,extensions"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Make the database look like Supabase (roles and extensions the migrations expect)
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c "create schema if not exists extensions; create extension if not exists pgcrypto schema extensions; create extension if not exists pg_trgm schema extensions; create role anon nologin; create role authenticated nologin; create role service_role nologin bypassrls;"
      - name: Apply every migration from scratch
        run: node --import tsx scripts/migrate.ts
      - name: Applying again must change nothing
        run: node --import tsx scripts/migrate.ts | tee /tmp/second.txt && grep -q " 0 to apply" /tmp/second.txt
      - name: Find a lead at 1,000,000 contacts (throwaway schema on this CI database; every search and page must answer in under 1 second)
        env:
          FIND_SCALE_DB: "1"
          FIND_ROWS: "1000000"
          DATABASE_URL: postgresql://postgres:ci@localhost:5432/postgres
          DATABASE_SSL: "off"
          DB_POOL_MAX: "1"
        run: npx vitest run tests/unit/find-lead-scale-db.test.ts --disableConsoleIntercept
      - name: Clean-up v2 at 1,000,000 contacts (throwaway schema on this CI database; duplicate scan, lists and lead intake under their limits; prints the size of the two new indexes)
        env:
          DQ_SCALE_DB: "1"
          DQ_ROWS: "1000000"
          DATABASE_URL: postgresql://postgres:ci@localhost:5432/postgres
          DATABASE_SSL: "off"
          DB_POOL_MAX: "1"
        run: npx vitest run tests/unit/dq-scale-db.test.ts --disableConsoleIntercept
      - name: Meeting notes cross-tenant test (two companies on this CI database; a call is read only by its owner, coaching is counts only, a task needs a certain contact)
        env:
          DATABASE_URL: postgresql://postgres:ci@localhost:5432/postgres
          DATABASE_SSL: "off"
          DB_POOL_MAX: "2"
          TOKEN_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
          NEXT_PUBLIC_APP_URL: http://localhost:3102
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon
          SUPABASE_SERVICE_ROLE_KEY: ci-service
          GHL_APP_ID: ci-app
          GHL_CLIENT_ID: ci-client
          GHL_CLIENT_SECRET: ci-secret
          GHL_APP_SHARED_SECRET: ci-shared
          GHL_REDIRECT_URI: http://localhost:3102/api/oauth/callback
        run: npx vitest run tests/unit/mn2-xtenant-db.test.ts --disableConsoleIntercept
      - name: Clients ignoring leads (reasons, automatic versus person reply, counts equal rows, another company never appears)
        env:
          DATABASE_URL: postgresql://postgres:ci@localhost:5432/postgres
          DATABASE_SSL: "off"
          DB_POOL_MAX: "2"
          TOKEN_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
          NEXT_PUBLIC_APP_URL: http://localhost:3102
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon
          SUPABASE_SERVICE_ROLE_KEY: ci-service
          GHL_APP_ID: ci-app
          GHL_CLIENT_ID: ci-client
          GHL_CLIENT_SECRET: ci-secret
          GHL_APP_SHARED_SECRET: ci-shared
          GHL_REDIRECT_URI: http://localhost:3102/api/oauth/callback
        run: npx vitest run tests/unit/ignored-leads-db.test.ts --disableConsoleIntercept
      - name: Share a report (link ids, names hidden by default, another company never sees or switches off a link, expiry and switch-off open nothing)
        env:
          DATABASE_URL: postgresql://postgres:ci@localhost:5432/postgres
          DATABASE_SSL: "off"
          DB_POOL_MAX: "2"
          TOKEN_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
          NEXT_PUBLIC_APP_URL: http://localhost:3102
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon
          SUPABASE_SERVICE_ROLE_KEY: ci-service
          GHL_APP_ID: ci-app
          GHL_CLIENT_ID: ci-client
          GHL_CLIENT_SECRET: ci-secret
          GHL_APP_SHARED_SECRET: ci-shared
          GHL_REDIRECT_URI: http://localhost:3102/api/oauth/callback
        run: npx vitest run tests/unit/report-share-db.test.ts --disableConsoleIntercept
      - name: Generate the framework types (a clean checkout does not have them)
        run: npx next typegen
      - run: npx tsc --noEmit
      - run: node --test "src/lib/__tests__/*.test.ts"

  changes:
    name: Did the migrations change?
    runs-on: ubuntu-latest
    outputs:
      migrations: ${{ steps.diff.outputs.migrations }}
    steps:
    # No required reviewers on this environment: the job runs by itself once Check passes.
        with:
          fetch-depth: 0
      - id: diff
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "migrations=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          before="${{ github.event.before }}"
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then range="HEAD~1"; else range="$before"; fi
          if git diff --name-only "$range" "${{ github.sha }}" -- supabase/migrations scripts/migrate.ts | grep -q .; then echo "migrations=true" >> "$GITHUB_OUTPUT"; else echo "migrations=false" >> "$GITHUB_OUTPUT"; fi

  apply:
    name: Apply to Supabase (needs approval)
    needs: [check, changes]
    if: >-
      ((github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.migrations == 'true') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    # Required reviewers on this environment make the job wait for a click from King.
    environment: production
    env:
      # The database connection address (Supabase, Connect, Session pooler, with the database password filled in). The workflow talks to the
      # database directly, so it does not need the Supabase access token or a project link.
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Check the connection address is set
        run: |
          test -n "$SUPABASE_DB_URL" || { echo "The secret SUPABASE_DB_URL is not set (Settings, Secrets and variables, Actions). Use Supabase, Connect, Session pooler, and put the database password in place of [YOUR-PASSWORD]."; exit 2; }
      - name: One-time baseline (only when a file name was given)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.baseline_through != '' }}
        run: |
          versions=$(ls supabase/migrations/*.sql | xargs -n1 basename | sort | awk -v stop="${{ inputs.baseline_through }}" '{print substr($0,1,14)} $0==stop{exit}')
          echo "Marking as already applied: $versions"
          supabase migration repair --status applied $versions --db-url "$SUPABASE_DB_URL" --yes
      - name: What would be applied
        if: ${{ inputs.baseline_through == '' }}
        run: supabase db push --dry-run --db-url "$SUPABASE_DB_URL" --yes
      - name: Apply
        if: ${{ inputs.baseline_through == '' && (github.event_name == 'push' || inputs.dry_run == false) }}
        run: supabase db push --db-url "$SUPABASE_DB_URL" --yes
